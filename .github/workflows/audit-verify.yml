name: Audit Verify

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: audit-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile broker_service.py
      - name: Unit tests
        run: python -m unittest -v
      - name: End-to-end dry-run tests
        run: python -m unittest -v test_e2e_dry_run
      - name: Lint GitHub Actions
        uses: reviewdog/action-actionlint@a5524e1c19e62881d79c1f1b9b6f09f16356e281
      - name: Scan secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
